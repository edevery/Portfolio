<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:393,&quot;height&quot;:852}}">
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.stage = React.createRef();
    this.T = 10900;
    this.geo = this.buildGeo();
    this._loopTimer = null;
  }
  buildGeo(){
    const defs=[
      {sx:-150,sy:-320,sr:-14},{sx:120,sy:-400,sr:10},{sx:-40,sy:-452,sr:-3},{sx:-160,sy:-360,sr:-12},
      {sx:150,sy:-380,sr:9},{sx:170,sy:-330,sr:-13},{sx:-140,sy:-400,sr:12},{sx:70,sy:-430,sr:6}
    ];
    return defs.map((d,i)=>({ ...d, inStart:0.12+i*0.04 }));
  }
  componentDidMount(){
    const stage=this.stage.current; if(!stage) return;
    this._fit=()=>{ const sc=Math.min(window.innerWidth/380, window.innerHeight/700); const w=stage.parentElement; if(w) w.style.transform='scale('+sc+')'; };
    this._fit(); window.addEventListener('resize', this._fit);
    stage.querySelectorAll('.l-casc').forEach((el)=>{ el.style.setProperty('--up', (-(+el.getAttribute('data-rank'))*34)+'px'); });
    this.start();
  }
  componentWillUnmount(){ window.__ncGen=(window.__ncGen||0)+1; if(this._loopTimer) clearTimeout(this._loopTimer); if(this._fit) window.removeEventListener('resize', this._fit); }
  finish(){
    const stage=this.stage.current; if(!stage) return;
    stage.querySelectorAll('.l-casc').forEach((el)=>{ el.style.transform=''; el.style.opacity=''; const fl=el.querySelector('.flabel'); if(fl) fl.style.opacity=''; });
    const af=stage.querySelector('.l-dropfolder .flabel'); if(af) af.style.opacity='';
    stage.classList.add('done');
  }
  start(){
    const stage=this.stage.current; if(!stage) return;
    if(this._loopTimer){ clearTimeout(this._loopTimer); this._loopTimer=null; }
    stage.style.transition=''; stage.style.opacity='';
    const gen=(window.__ncGen=(window.__ncGen||0)+1);
    stage.classList.remove('done');
    const t0=performance.now(); const T=this.T;
    this.frame(0);
    const iv=setInterval(()=>{
      if(window.__ncGen!==gen){ clearInterval(iv); return; }
      let p=(performance.now()-t0)/T;
      if(p>=1){ this.frame(1); this.finish(); clearInterval(iv);
        this._loopTimer=setTimeout(()=>{ if(window.__ncGen===gen) this.start(); }, 2000);
        return; }
      this.frame(p);
    },16);
  }
  frame(p){
    const stage=this.stage.current; if(!stage) return;
    const clamp=(x)=>Math.max(0,Math.min(1,x));
    const lerp=(a,b,t)=>a+(b-a)*t;
    const eOut=(t)=>1-Math.pow(1-t,3);
    const eIn=(t)=>t*t;
    const eInOut=(t)=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    const eBack=(t)=>{ const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); };
    const WIN=0.18, MOUTH_Y=0, IN_Y=108;
    const CS0=0.0,CS1=0.07, AP0=0,AP1=0.07, D0=0,D1=0.07, CA0=0.60,CA1=0.68, CO0=0.90,CO1=1.0;
    const DROP_Y=275, DROP_SCALE=0.90, RISE=34;
    stage.querySelectorAll('.l-note').forEach((el)=>{
      const g=this.geo[+el.getAttribute('data-i')]; const u=(p-g.inStart)/WIN;
      let mx,my,r,sc,op;
      if(u<=0){op=0;mx=g.sx;my=g.sy;r=g.sr;sc=0.85;}
      else if(u>=1){op=0;mx=0;my=IN_Y;r=0;sc=0.9;}
      else if(u<0.62){const a=eOut(u/0.62);mx=lerp(g.sx,0,a);my=lerp(g.sy,MOUTH_Y,a);r=lerp(g.sr,0,a);sc=lerp(0.85,1,a);op=clamp(a*5);}
      else{const b=eIn((u-0.62)/0.38);mx=0;my=lerp(MOUTH_Y,IN_Y,b);r=0;sc=lerp(1,0.85,b);op=1;}
      el.style.opacity=op; el.style.transform='translate('+mx+'px,'+my+'px) rotate('+r+'deg) scale('+sc+')';
    });
    stage.querySelectorAll('.case-part').forEach((el)=>{
      el.style.opacity=1;
      const base=el.style.left==='50%'?'translateX(-50%) ':'';
      el.style.transform=base+'translateY(0px)';
    });
    const cap=stage.querySelector('.l-cap'); if(cap) cap.style.opacity=1;
    const folder=stage.querySelector('.l-dropfolder');
    if(folder){
      folder.style.opacity=1;
      folder.style.transform='translate(0px,'+DROP_Y+'px) scale('+DROP_SCALE+')';
    }
    const cascadeUp=clamp((p-CA0)/(CA1-CA0));
    const collapse=eInOut(clamp((p-CO0)/(CO1-CO0)));
    stage.querySelectorAll('.l-casc').forEach((el)=>{
      const rank=+el.getAttribute('data-rank');
      const st=(rank-1)/8*0.5;
      const spUp=clamp((cascadeUp-st)/0.5);
      const eUp=eBack(spUp);
      const factor=eUp*(1-collapse);
      el.style.opacity=clamp(spUp*5);
      el.style.transform='translateY('+(-rank*RISE*factor)+'px)';
      const fl=el.querySelector('.flabel'); if(fl) fl.style.opacity=clamp((factor-0.15)/0.5);
    });
    const af=stage.querySelector('.l-dropfolder .flabel');
    if(af) af.style.opacity=(1-collapse)*clamp(cascadeUp/0.5);
    const logo=stage.querySelector('.l-logo');
    if(logo){
      const rise=eOut(clamp((collapse-0.25)/0.75));
      logo.style.opacity=rise;
      logo.style.transform='translateX(-50%) translateY('+lerp(14,0,rise)+'px) scale('+lerp(0.94,1,rise)+')';
    }
  }
  renderVals(){ return { stageRef:this.stage }; }
